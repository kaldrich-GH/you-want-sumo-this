<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Want Sumo This? — Sheets Connection Test</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f6f1e7;color:#292825;max-width:680px;margin:10vh auto;padding:20px}
main{background:white;padding:28px;border:1px solid #ddd4c5;border-radius:14px}button{background:#a13d2b;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:14px;border-radius:8px}small{color:#666}
</style>
</head>
<body><main><h1>🥋 Google Sheets connection test</h1><p>Checks whether this GitHub Pages site can read the public Google Apps Script data feed. It never writes data.</p><button id="test">Test connection</button><p id="status" role="status">Ready.</p><pre id="details" aria-label="Test details"></pre><small>Read-only browser test. No passwords or private data needed.</small></main>
<script>
'use strict';
const endpoint='https://script.google.com/macros/s/AKfycbyql3CkUq9dQwnnCIzEAVat9p9LbC2uYIwYHIrQjmf1gkMB93LLJz0Az5ozHHY63Fdk/exec';
const statusEl=document.getElementById('status');
const details=document.getElementById('details');
document.getElementById('test').addEventListener('click',async()=>{
 statusEl.textContent='Testing browser access…';details.textContent='';
 try{
  const response=await fetch(endpoint,{method:'GET',redirect:'follow',cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(data.schemaVersion!==1||data.readOnly!==true)throw new Error('Response did not match the expected public data format.');
  statusEl.textContent='SUCCESS — GitHub Pages can read the Sheets endpoint!';
  details.textContent=JSON.stringify({schemaVersion:data.schemaVersion,readOnly:data.readOnly,bashos:(data.sheets?.['Basho Index']||[]).length,managers:(data.sheets?.Managers||[]).length,rosters:(data.sheets?.['Basho Rosters']||[]).length},null,2);
 }catch(err){
  statusEl.textContent='BROWSER REQUEST BLOCKED OR FAILED';
  details.textContent=String(err)+'\n\nIf the /exec URL works in a browser tab but this test fails, cross-origin (CORS) restrictions are a likely cause. This does not mean the endpoint is broken.';
 }
});
</script></body></html>
