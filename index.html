
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YWST · Fantasy Sumo</title>
<style>
:root{--ink:#161b1a;--paper:#fff2cd;--gold:#ffcc38;--red:#ed3023;--blue:#167d9e;--line:#1b2421}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;background:#f6e9c8;background-image:radial-gradient(#d6c9a633 1px,transparent 1px);background-size:15px 15px}
button,select{font:inherit}
button{cursor:pointer}
header{background:#fff6df;border-bottom:5px solid var(--ink)}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{font-weight:1000;font-size:clamp(25px,4vw,43px);letter-spacing:-2px;line-height:1}
.micro{font-size:11px;font-weight:900;letter-spacing:2px;color:#ae3527}
.seal{font-size:26px;color:#c5241e;border:3px solid #c5241e;padding:4px 8px;font-weight:900}
nav{display:flex;gap:5px;flex-wrap:wrap}
nav button,nav a{border:0;background:transparent;color:var(--ink);font-weight:900;text-decoration:none;padding:13px 17px;text-transform:uppercase;font-size:12px}
nav button.active{background:var(--red);color:#fff;box-shadow:inset 0 -4px #9c130d}
nav button:hover,nav a:hover{background:var(--gold);color:var(--ink)}
.hero{background:var(--gold);border-bottom:7px solid var(--ink);position:relative;overflow:hidden}
.hero:before{content:none}
.hero-inner{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:240px;gap:18px}
.hero-title{font-size:clamp(49px,9vw,100px);line-height:.92;font-weight:1000;letter-spacing:-6px;text-shadow:5px 5px 0 #fff6df;margin:10px 0}
.hero-jp{font-size:clamp(38px,7vw,80px);font-weight:1000;line-height:1;color:#171b18;letter-spacing:-6px}
.hero-sub{font-weight:1000;font-size:17px;letter-spacing:4px}
.sun{display:none;width:180px;height:180px;min-width:180px;background:#ec3226;border:7px solid #161b1a;border-radius:50%;box-shadow:14px 14px 0 #fff2ce;display:grid;place-items:center;transform:rotate(8deg);font-size:92px;font-weight:1000;color:#fff0c9}
.status-strip{background:#111d1c;color:#fff2ce;border-bottom:5px solid var(--red)}
.strip-inner{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;padding:13px 0;font-size:12px;font-weight:900;letter-spacing:1px}
.dots{display:flex;gap:5px}
.dot{width:13px;height:13px;border:2px solid #d8a530;background:#f4e7c8;border-radius:50%}
.dot.done{background:var(--gold)}
main{padding:25px 0 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.toolbar select,.toolbar button,.day-controls select{background:#fffaf0;border:2px solid var(--ink);padding:9px 12px;font-weight:800}
.toolbar button{background:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:18px}
.panel{background:#fffaf0;border:3px solid var(--ink);box-shadow:6px 6px 0 #191e1c;margin-bottom:20px;min-width:0}
.panel h2{margin:0;background:#ffcc38;border-bottom:3px solid var(--ink);padding:13px 17px;text-transform:uppercase;font-size:22px;font-weight:1000;letter-spacing:-.8px}
.panel .inner{padding:13px 16px}
.board-row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;border-bottom:2px solid #e5d9bc;padding:11px 4px;cursor:pointer}
.board-row:hover{background:#ffe8a1}
.board-row:first-child{background:#ffe4a0}
.place{font-weight:1000;font-size:28px;font-style:italic}
.board-row:first-child .place{color:#d82418}
.teamname{font-size:17px;font-weight:950}
.meta{font-size:12px;color:#605a4f;font-weight:700}
.points{font-size:24px;font-weight:1000;color:#9e241a}
.muted{color:#6c675e;font-size:13px}
.tabs{display:none}
.tabs.active{display:block}
.heya-pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.heya-pick button{background:#fffaf0;border:2px solid #1b2421;padding:10px;font-weight:850}
.heya-pick button.selected{background:var(--gold);box-shadow:3px 3px 0 #151b1a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.rikishi{border:3px solid var(--ink);background:#fff2d1;overflow:hidden;min-width:0}
.rikishi .art{height:116px;background:linear-gradient(145deg,#f6c544 0%,#e93c29 65%,#b82a1c 100%);position:relative;display:flex;align-items:end;justify-content:center;overflow:hidden}
.rikishi:nth-child(3n+2) .art{background:linear-gradient(145deg,#78d6db,#117e9c)}
.rikishi:nth-child(3n) .art{background:linear-gradient(145deg,#ffdb74,#b65a29)}
.rikishi .art:before{content:"";position:absolute;width:83px;height:85px;background:#f4c79b;border:4px solid #151a18;border-radius:48% 48% 37% 37%;bottom:-24px}
.rikishi .art:after{content:"";position:absolute;width:45px;height:24px;background:#171c1a;border-radius:60% 60% 20% 20%;bottom:61px}
.rikishi .ranktag{position:absolute;left:7px;top:7px;background:#191e1c;color:#fff2d1;padding:4px 6px;font-size:12px;font-weight:950;z-index:1}
.rikishi .body{padding:10px}
.rikishi .name{font-size:15px;font-weight:1000;overflow-wrap:anywhere}
.rikishi .score{font-size:26px;font-weight:1000;color:#bc261b}
.rikishi .badge{display:inline-block;background:#ed3324;color:white;font-size:10px;font-weight:950;padding:3px 5px;margin:3px 3px 0 0}
.rikishi.reserve{opacity:.68}
.results-table{width:100%;border-collapse:collapse;font-size:13px}
.results-table th{text-align:left;background:#f7e5b3}
.results-table td,.results-table th{padding:10px 7px;border-bottom:1px solid #ddcfaa}
.results-table td:last-child{text-align:right;font-weight:1000}
.day-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px}
.empty{padding:25px;color:#615d54}
.section-heading{font-size:27px;font-weight:1000;text-transform:uppercase;margin:20px 0 13px}
.footer{text-align:center;padding:30px 10px;font-size:12px;font-weight:850;color:#6a5e48}
.error{background:#ffded8;color:#8d1c15;padding:12px;border:2px solid #8d1c15}
.loader{padding:20px}
.tiny{font-size:11px;font-weight:850}
.feature{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #e3d6b6}
.medal{width:42px;height:42px;background:#ffcc38;border:2px solid #161b1a;display:grid;place-items:center;font-size:22px;font-weight:1000;flex:none}
@media(max-width:750px){
.layout{grid-template-columns:1fr}
.hero-inner{min-height:185px}
.sun{width:90px;height:90px;min-width:90px;font-size:49px;border-width:4px}
.hero-title{letter-spacing:-3px}
.hero-jp{letter-spacing:-2px}
.mast{padding:12px 0}
nav button,nav a{padding:10px;font-size:11px}
.wrap{padding:0 13px}
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.board-row{grid-template-columns:40px 1fr auto}
.teamname{font-size:14px}
}

<body>
<div class="hero">

    <h1 class="league-hero">YOU WANT<br>SUMO THIS?</h1>

</div>

<div class="status-strip">

      <label for="basho-select">BASHO</label>
      <select id="basho-select" aria-label="Choose current or previous basho"></select>

<div class="nav-bar">

  <div class="toolbar">
    <div class="tiny" id="sync-status" role="status">Connecting to league data…</div>

        <h2>🔥 Rikishi leaderboard</h2>

        </div>
      </div>

<div class="footer">YOU WANT SUMO THIS? · 大相撲</div>

<script>
(()=>{
'use strict';

const ENDPOINT='https://script.google.com/macros/s/AKfycbzABK7_P_r-89sdhMlqJThOjKfoVdOY-UqskVQ3ARzKrFZKZGq0C2QBPd5FjX942Arl/exec';

const $=id=>document.getElementById(id),
norm=x=>String(x??'').trim(),
field=(r,...keys)=>keys.map(k=>norm(r?.[k])).find(Boolean)||'',
number=x=>norm(x)!==''&&Number.isFinite(Number(x))?Number(x):null;

let db=null,basho='',heya='',day=1;

const sheets=n=>Array.isArray(db?.sheets?.[n])?db.sheets[n]:[],
matches=r=>!basho||field(r,'Basho ID')===basho,
managers=()=>sheets('Managers'),
rosters=()=>sheets('Basho Rosters').filter(matches),
daily=()=>sheets('Daily Results').filter(matches),
managerId=r=>field(r,'Manager ID'),
heyaName=r=>(field(r,'Current Heya Name','Heya Name','Manager ID')||'Unnamed Heya').replace(/Wockwockkage/gi,'Wockawockakage'),
reserve=r=>/reserve|bench|alternate|substitute/i.test(field(r,'Slot'));

const mk=(tag,cls,txt)=>{
  const n=document.createElement(tag);
  if(cls)n.className=cls;
  if(txt!==undefined)n.textContent=txt;
  return n;
};

function setView(v){
  document.querySelectorAll('.tabs').forEach(n=>n.classList.toggle('active',n.id==='view-'+v));
  document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('[data-view]').forEach(n=>n.addEventListener('click',()=>setView(n.dataset.view)));

function calc(){
  const rr=rosters(), dr=daily(), map=new Map();
  const swaps=sheets('Roster Swaps').filter(matches);

  for(const m of managers()){
    const id=managerId(m);
    const entries=rr.filter(r=>managerId(r)===id);
    const active=entries.filter(r=>!reserve(r));

    const starterIds=new Set(
      active.map(r=>field(r,'Rikishi ID')).filter(Boolean)
    );

    const teamSwaps=swaps.filter(r=>managerId(r)===id);
    const swap=teamSwaps[0];

    const scored=dr.filter(r=>{
      if(managerId(r)!==id || number(r.Points)===null)
        return false;

      const rikishiId=field(r,'Rikishi ID');
      const resultDay=Number(field(r,'Day'));

      if(!Number.isInteger(resultDay) ||
         resultDay<1 || resultDay>15)
        return false;

      if(teamSwaps.length>1)
        return false;

      if(swap && resultDay>=5){
        const outgoing=field(swap,'Outgoing Rikishi ID');
        const incoming=field(swap,'Incoming Rikishi ID');

        return rikishiId===incoming ||
          (rikishiId!==outgoing && starterIds.has(rikishiId));
      }

      return starterIds.has(rikishiId);
    });

    map.set(id,{
      id,
      name:heyaName(m),
      entries,
      active,
      score:scored.length
        ?scored.reduce((a,r)=>a+Number(r.Points),0)
        :null,
      scored:scored.length
    });
  }

  return [...map.values()].sort(
    (a,b)=>(b.score??-Infinity)-(a.score??-Infinity)||
      a.name.localeCompare(b.name)
  );
}

function pointsFor(r){
  const id=field(r,'Rikishi ID'),name=field(r,'Rikishi Name');
  const arr=daily().filter(d=>managerId(d)===managerId(r)&&(id?field(d,'Rikishi ID')===id:field(d,'Rikishi Name')===name));
  const valid=arr.filter(d=>number(d.Points)!==null);
  return {
    points:valid.length?valid.reduce((a,d)=>a+Number(d.Points),0):null,
    rows:arr
  };
}

function render(){
  if(!db)return;
  const bs=sheets('Basho Index'),
  prev=basho,
  active=bs.find(r=>field(r,'Status').toLowerCase()==='active');
  if(!bs.some(r=>field(r,'Basho ID')===basho))basho=field(active||bs[0],'Basho ID');

  const picker=$('basho-select');
  picker.replaceChildren();
  for(const b of bs){
    const id=field(b,'Basho ID');
    if(!id)continue;
    const o=mk('option','',field(b,'Basho Name')||id);
    o.value=id;
    picker.append(o);
  }
  picker.value=basho;

  const teams=calc();
  $('standings-board').replaceChildren();
  for(const [i,t] of teams.entries()){
    const row=mk('div','board-row'),
    rank=mk('span','place',String(i+1)),
    name=mk('div'),
    score=mk('span','points',t.score===null?'—':String(t.score));
    name.append(
      mk('div','teamname',t.name),
      mk('div','meta',t.active.length+' starters · '+t.entries.length+' roster slots')
    );
    row.append(rank,name,score);
    row.addEventListener('click',()=>{
      heya=t.id;
      renderHeyas(teams);
      setView('heyas');
    });
    $('standings-board').append(row);
  }
  if(!teams.length)$('standings-board').append(mk('div','empty','No team data available.'));
  renderHeyas(teams);
  renderLeaders(teams);
  renderDays();
  $('sync-status').textContent='LIVE · '+teams.length+' HEYAS · '+rosters().length+' ROSTER ROWS';
}

function renderHeyas(teams){
  if(!teams.some(t=>t.id===heya))heya=teams[0]?.id||'';
  const buttons=$('heya-pick');
  buttons.replaceChildren();
  for(const t of teams){
    const b=mk('button',t.id===heya?'selected':'',t.name);
    b.onclick=()=>{
      heya=t.id;
      renderHeyas(teams);
    };
    buttons.append(b);
  }
  const team=teams.find(t=>t.id===heya);
  $('selected-heya').textContent=team?.name||'Team roster';
  $('heya-summary').textContent=team?`${team.active.length} starters · ${team.entries.length-team.active.length} reserve · ${team.score??'—'} fantasy points`:'';
  const cards=$('roster-cards');
  cards.replaceChildren();
  if(!team)return;
  for(const r of team.entries){
    const info=pointsFor(r),
    card=mk('div','rikishi'+(reserve(r)?' reserve':'')),
    art=mk('div','art'),
    rank=mk('span','ranktag',field(r,'Rank','Current Rank','Slot')||'RIKISHI');
    art.append(rank);
    const body=mk('div','body');
    body.append(
      mk('div','name',field(r,'Rikishi Name')||'Unknown rikishi'),
      mk('div','meta',reserve(r)?'RESERVE':'STARTER'),
      mk('div','score',(info.points??'—')+' pts')
    );
    const wins=info.rows.filter(x=>/^(w|win)$/i.test(field(x,'Result','Outcome'))).length;
    if(info.rows.length)body.append(mk('div','meta',info.rows.length+' recorded results'+(wins?' · '+wins+' wins':'')));
    if(info.rows.some(x=>/^(true|yes|1)$/i.test(field(x,'Kinboshi'))))body.append(mk('span','badge','★ KINBOSHI'));
    if(info.rows.some(x=>/^(true|yes|1)$/i.test(field(x,'Torinaoshi'))))body.append(mk('span','badge','TORINAOSHI'));
    card.append(art,body);
    cards.append(card);
  }
}

function renderLeaders(teams){
  const all=[];
  for(const t of teams)
    for(const r of t.entries.filter(x=>!reserve(x))){
      const p=pointsFor(r);
      if(p.points!==null)all.push({
        name:field(r,'Rikishi Name'),
        team:t.name,
        points:p.points
      });
    }
  all.sort((a,b)=>b.points-a.points);
  const el=$('rikishi-leaders');
  el.replaceChildren();
  if(!all.length){
    el.append(mk('div','empty','No scored rikishi yet. Results will appear here once published.'));
    return;
  }
  for(const [i,r] of all.slice(0,8).entries()){
    const item=mk('div','feature');
    item.append(
      mk('div','medal',String(i+1)),
      mk('div','',r.name+' · '+r.team),
      mk('strong','points',String(r.points))
    );
    item.children[1].style.flex='1';
    el.append(item);
  }
}

function renderDays(){
  const rows=daily(),
  days=[...new Set(rows.map(r=>Number(field(r,'Day','Basho Day'))).filter(x=>x>=1&&x<=15))].sort((a,b)=>a-b);
  const sel=$('day-select');
  sel.replaceChildren();
  for(let i=1;i<=15;i++){
    const opt=mk('option','','Day '+i);
    opt.value=i;
    sel.append(opt);
  }
  if(!days.includes(day))day=days.at(-1)||1;
  sel.value=String(day);
  const shown=rows.filter(r=>Number(field(r,'Day','Basho Day'))===day),
  tbody=$('daily-rows');
  tbody.replaceChildren();
  for(const r of shown){
    const tr=mk('tr'),
    manager=managers().find(m=>managerId(m)===managerId(r));
    for(const txt of [
      field(r,'Rikishi Name')||field(r,'Rikishi ID'),
      field(r,'Result','Outcome','Win/Loss')||'Recorded',
      manager?heyaName(manager):'—',
      number(r.Points)===null?'—':String(r.Points)
    ])tr.append(mk('td','',txt));
    tbody.append(tr);
  }
  if(!shown.length){
    const tr=mk('tr'),
    td=mk('td','empty','No results published for this day.');
    td.colSpan=4;
    tr.append(td);
    tbody.append(tr);
  }
  $('day-result-count').textContent=shown.length+' result rows';
  const summary=$('day-summary');
  summary.replaceChildren();
  summary.append(mk('div','section-heading',days.length+' / 15 days'));
  summary.append(mk('p','muted',days.length?'Days with recorded results: '+days.join(', '):'Waiting for the first published results.'));
  summary.append(mk('p','muted','Points are read from the existing league feed. No results or awards are invented.'));
}

$('day-select').addEventListener('change',e=>{
  day=Number(e.target.value);
  renderDays();
});
$('basho-select').addEventListener('change',e=>{
  basho=e.target.value;
  day=1;
  render();
});

async function load(){
  const btn=$('refresh');
  btn.disabled=true;
  $('sync-status').textContent='Refreshing league data…';
  const ctl=new AbortController(),
  timer=setTimeout(()=>ctl.abort(),18000);
  try{
    const res=await fetch(ENDPOINT,{cache:'no-store',signal:ctl.signal});
    if(!res.ok)throw Error('HTTP '+res.status);
    const data=await res.json();
    if(data.schemaVersion!==1||data.readOnly!==true||!data.sheets)throw Error('Unexpected league feed');
    db=data;
    render();
  }catch(e){
    $('sync-status').textContent='Connection error: '+e.message+' · '+(db?'Showing last loaded data':'Try Refresh');
  }finally{
    clearTimeout(timer);
    btn.disabled=false;
  }
}
$('refresh').onclick=load;
load();
})();
</script>
</body>
</html>
